jobmanager.rpc.address: jobmanager
parallelism.default: 2
taskmanager.numberOfTaskSlots: 1

# Memoria acotada a propósito: el stack completo tiene que entrar en una máquina de
# desarrollo. Si sobra memoria, subir numberOfTaskSlots antes que el tamaño del proceso.
taskmanager.memory.process.size: 1536m
taskmanager.memory.task.off-heap.size: 384m
taskmanager.memory.managed.fraction: 0.1
taskmanager.memory.network.min: 64m
taskmanager.memory.network.max: 64m
jobmanager.memory.process.size: 768m

# El pipeline mantiene estado por medidor (última lectura para diferenciar, e ids vistos
# para deduplicar), así que el checkpointing no es opcional: sin él, un reinicio pierde el
# estado y las lecturas siguientes no se pueden diferenciar contra nada.
execution.checkpointing.interval: 30s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.min-pause: 5s
execution.checkpointing.timeout: 180s
execution.checkpointing.tolerable-failed-checkpoints: 3
state.backend.type: hashmap

taskmanager.load-balance.mode: SLOTS
