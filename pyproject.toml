[project]
name = "streaming-medicion-tarifa-horaria"
version = "0.1.0"
description = "Pipeline de streaming con Kafka y Beam que agrega consumo eléctrico por franja horaria"
readme = "README.md"
license = "MIT"
# Fijado por el job server de Beam del stack (apache/beam_flink1.19_job_server:2.74.0):
# apache-beam 2.74.0 y el intérprete que esa versión soporta.
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-beam[gcp]==2.74.0",
  "confluent-kafka>=2.8,<3",
  # Beam ejecuta `pip freeze` al enviar el trabajo, para registrar con qué dependencias se
  # armó. Sin pip el envío igual funciona, pero avisa y se pierde esa trazabilidad.
  "pip>=25,<27",
]

[project.scripts]
simulador = "simulador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulador/src/simulador", "pipeline/src/pipeline"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["simulador/src", "pipeline/src"]
testpaths = ["tests"]
filterwarnings = [
  # Beam llama TestPipeline y TestStream a clases que no son pruebas; pytest intenta
  # recolectarlas y avisa. Es ruido de la librería, no un problema nuestro.
  "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Beam EXIGE que StateParam y TimerParam vayan como valores por defecto de los parámetros:
# es así como el runner descubre qué estado y qué temporizadores usa un DoFn. B008 marca eso
# como error, pero acá no hay alternativa.
"pipeline/src/pipeline/transformaciones.py" = ["B008"]
