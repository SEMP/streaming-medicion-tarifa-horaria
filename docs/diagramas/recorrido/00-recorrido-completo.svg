  <rect x="206" y="150" width="152" height="150" rx="7" fill="#fffbeb" stroke="#b7791f" stroke-width="1.6"/>
  <text x="218" y="172" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">02</text>
  <text x="218" y="192" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1a202c" font-weight="600" text-anchor="start">Tópico crudo</text>
  <text x="218" y="242" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="10.5" fill="#4a5568" font-weight="normal" text-anchor="start">clave=medidor · JSON</text>
  <line x1="358" y1="225" x2="369" y2="225" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
