  <text x="384" y="192" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1a202c" font-weight="600" text-anchor="start">Parsear y marcar el</text>
  <text x="384" y="207" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1a202c" font-weight="600" text-anchor="start">tiempo</text>
  <text x="384" y="242" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="10.5" fill="#4a5568" font-weight="normal" text-anchor="start">(&#x27;MED-0042&#x27;, dict)</text>
  <text x="384" y="256" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="10.5" fill="#4a5568" font-weight="normal" text-anchor="start">con tiempo de evento</text>
