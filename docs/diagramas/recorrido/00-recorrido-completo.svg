  <line x1="448" y1="300" x2="448" y2="354" stroke="#c53030" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flr)"/>
  <rect x="538" y="150" width="152" height="150" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="550" y="172" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2c5282" font-weight="700" text-anchor="start">04</text>
  <text x="550" y="192" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1a202c" font-weight="600" text-anchor="start">Ventana y</text>
  <text x="550" y="207" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1a202c" font-weight="600" text-anchor="start">deduplicación</text>
