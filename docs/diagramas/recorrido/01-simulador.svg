<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 798" width="1120" height="798" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker></defs>
  <rect width="1120" height="798" fill="#ffffff"/>
  <text x="40" y="44" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">01. Simulador</text>
  <text x="40" y="70" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#553c9a" font-weight="600" text-anchor="start">El dato nace porque alguien lo pidió</text>
  <rect x="40" y="110" width="1040" height="102" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6"/>
  <text x="56" y="132" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#718096" font-weight="700" text-anchor="start">LO QUE LLEGA</text>
  <text x="56" y="152" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">Nada. El medidor no transmite por su cuenta:</text>
  <text x="56" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">el concentrador pregunta, medidor por medidor,</text>
  <text x="56" y="188" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">sobre un bus RS-485 compartido.</text>
  <line x1="560" y1="214" x2="560" y2="232" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="238" width="1040" height="138" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="56" y="260" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#553c9a" font-weight="700" text-anchor="start">QUÉ LE PASA</text>
  <text x="56" y="280" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. El concentrador recorre la cabina en orden</text>
  <text x="56" y="298" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. Pregunta el registro OBIS 15.8.0</text>
  <text x="56" y="316" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. El medidor responde su CONTADOR ACUMULADO,</text>
  <text x="56" y="334" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   no el consumo del intervalo</text>
  <text x="56" y="352" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. Se arma la Lectura y se sella event_id</text>
  <line x1="560" y1="378" x2="560" y2="396" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="402" width="1040" height="246" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="56" y="424" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">LO QUE SALE</text>
  <text x="56" y="444" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">{</text>
  <text x="56" y="462" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;schema_version&quot;: 1,</text>
  <text x="56" y="480" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;event_id&quot;: &quot;d4612d921b39e34a&quot;,</text>
  <text x="56" y="498" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;medidor_id&quot;: &quot;MED-0042&quot;,</text>
  <text x="56" y="516" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;cabina_id&quot;: &quot;CAB-07&quot;,</text>
  <text x="56" y="534" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;instante_lectura&quot;: &quot;2026-09-25T17:55:00-03:00&quot;,</text>
  <text x="56" y="552" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;registros&quot;: [{&quot;obis&quot;: &quot;15.8.0&quot;,</text>
  <text x="56" y="570" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">    &quot;naturaleza&quot;: &quot;acumulado&quot;,</text>
  <text x="56" y="588" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">    &quot;valor&quot;: 101.5, &quot;unidad&quot;: &quot;kWh&quot;}],</text>
  <text x="56" y="606" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;calidad&quot;: &quot;ok&quot;</text>
  <text x="56" y="624" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">}</text>
  <text x="40" y="674" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#1a202c" font-weight="700" text-anchor="start">POR QUÉ</text>
  <text x="40" y="700" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">El valor 101,5 no es lo que se consumió: es el total desde que el medidor existe. El consumo hay que sacarlo restando,</text>
  <text x="40" y="718" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">y por eso hace falta recordar la lectura anterior. Y el event_id es sha256(medidor|instante): un reintento de</text>
  <text x="40" y="736" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">publicación produce el mismo id, que es lo que lo hace reconocible como duplicado.</text>
  <text x="40" y="770" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">simulador/src/simulador/evento.py:58 (Lectura) · valor real de Lectura.a_dict()</text>
</svg>
