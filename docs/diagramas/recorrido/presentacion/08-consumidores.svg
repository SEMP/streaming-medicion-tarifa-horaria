  <text x="32" y="166" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">QUÉ LE PASA</text>
  <text x="32" y="186" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">El tablero relee desde el offset 0 y hace upsert</text>
