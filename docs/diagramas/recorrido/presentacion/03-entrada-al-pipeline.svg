  <text x="32" y="204" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   el medidor sale del cuerpo; la clave es respaldo</text>
  <text x="32" y="222" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. Se lee instante_lectura y se exige su huso</text>
