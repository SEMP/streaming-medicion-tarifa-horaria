  <text x="32" y="94" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">         &quot;d4612d921b39e34a&quot;, &quot;medidor_id&quot;: ...}&#x27;</text>
