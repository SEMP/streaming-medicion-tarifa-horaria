<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 552" width="592" height="552" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker></defs>
  <rect width="592" height="552" fill="#ffffff"/>
  <rect x="16" y="16" width="560" height="84" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6"/>
  <text x="32" y="38" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#718096" font-weight="700" text-anchor="start">LO QUE LLEGA</text>
  <text x="32" y="58" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">Nada. El medidor no transmite por su cuenta: el concentrador pregunta,</text>
  <text x="32" y="76" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">medidor por medidor, sobre un bus RS-485 compartido.</text>
  <line x1="296" y1="102" x2="296" y2="120" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="16" y="126" width="560" height="138" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="32" y="148" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#553c9a" font-weight="700" text-anchor="start">QUÉ LE PASA</text>
  <text x="32" y="168" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. El concentrador recorre la cabina en orden</text>
  <text x="32" y="186" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. Pregunta el registro OBIS 15.8.0</text>
  <text x="32" y="204" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. El medidor responde su CONTADOR ACUMULADO,</text>
  <text x="32" y="222" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   no el consumo del intervalo</text>
  <text x="32" y="240" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. Se arma la Lectura y se sella el event_id</text>
  <line x1="296" y1="266" x2="296" y2="284" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="16" y="290" width="560" height="246" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="32" y="312" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">LO QUE SALE — es lo que llega a la 02</text>
  <text x="32" y="332" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">{</text>
  <text x="32" y="350" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;schema_version&quot;: 1,</text>
  <text x="32" y="368" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;event_id&quot;: &quot;d4612d921b39e34a&quot;,</text>
  <text x="32" y="386" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;medidor_id&quot;: &quot;MED-0042&quot;,</text>
  <text x="32" y="404" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;cabina_id&quot;: &quot;CAB-07&quot;,</text>
  <text x="32" y="422" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;instante_lectura&quot;: &quot;2026-09-25T17:55:00-03:00&quot;,</text>
  <text x="32" y="440" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;registros&quot;: [{&quot;obis&quot;: &quot;15.8.0&quot;,</text>
  <text x="32" y="458" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">    &quot;naturaleza&quot;: &quot;acumulado&quot;,</text>
  <text x="32" y="476" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">    &quot;valor&quot;: 101.5, &quot;unidad&quot;: &quot;kWh&quot;}],</text>
  <text x="32" y="494" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;calidad&quot;: &quot;ok&quot;</text>
  <text x="32" y="512" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">}</text>
</svg>
