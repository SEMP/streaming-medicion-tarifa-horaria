<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 966" width="640" height="966" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker></defs>
  <rect width="640" height="966" fill="#ffffff"/>
  <text x="40" y="44" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">06. Atribuir la franja y agregar</text>
  <text x="40" y="70" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#2c5282" font-weight="600" text-anchor="start">Donde el intervalo se convierte en plata, y donde puede cruzar un borde</text>
  <rect x="40" y="110" width="560" height="192" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6"/>
  <text x="56" y="132" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#718096" font-weight="700" text-anchor="start">LO QUE LLEGA — es la salida de la 05</text>
  <text x="56" y="152" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">Consumo(</text>
  <text x="56" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  medidor_id=&#x27;MED-0042&#x27;,</text>
  <text x="56" y="188" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  cabina_id=&#x27;CAB-07&#x27;,</text>
  <text x="56" y="206" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  desde=&#x27;2026-09-25T17:40:00-03:00&#x27;,</text>
  <text x="56" y="224" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  hasta=&#x27;2026-09-25T17:55:00-03:00&#x27;,</text>
  <text x="56" y="242" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  energia_kwh=1.5,</text>
  <text x="56" y="260" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  separacion_minutos=15.0</text>
  <text x="56" y="278" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">)</text>
  <line x1="320" y1="304" x2="320" y2="322" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="328" width="560" height="192" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="56" y="350" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2c5282" font-weight="700" text-anchor="start">QUÉ LE PASA</text>
  <text x="56" y="370" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. ¿Hay ya un intervalo igual o más corto para</text>
  <text x="56" y="388" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   ese borde izquierdo? Entonces este quedó</text>
  <text x="56" y="406" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   superado y no se suma</text>
  <text x="56" y="424" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. Recalcula TODAS las celdas del medidor</text>
  <text x="56" y="442" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. Reparte por franja; si el intervalo cruza</text>
  <text x="56" y="460" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   un borde, interpola suponiendo potencia</text>
  <text x="56" y="478" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   constante, y lo declara</text>
  <text x="56" y="496" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. Emite solo lo que cambió</text>
  <line x1="320" y1="522" x2="320" y2="540" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="546" width="560" height="216" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="56" y="568" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">LO QUE SALE — es lo que llega a la 07</text>
  <text x="56" y="588" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">(&#x27;MED-0042|2026-09-25|resto&#x27;,</text>
  <text x="56" y="606" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start"> {&quot;energia_kwh&quot;: 1.5, &quot;interpolada&quot;: false,</text>
  <text x="56" y="624" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;indeterminada&quot;: false, &quot;minutos_cubiertos&quot;: 15.0,</text>
  <text x="56" y="642" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;separacion_maxima_minutos&quot;: 15.0,</text>
  <text x="56" y="660" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">  &quot;cabina_id&quot;: &quot;CAB-07&quot;, &quot;intervalos_usados&quot;: 1})</text>
  <text x="56" y="682" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">y cuando llega el intervalo que cruza las 18:00,</text>
  <text x="56" y="699" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">esta misma celda se reemite y aparece la otra:</text>
  <text x="56" y="716" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">  MED-0042|2026-09-25|resto  2.3  interpolada</text>
  <text x="56" y="733" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">  MED-0042|2026-09-25|punta  3.2  interpolada</text>
  <text x="40" y="788" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#1a202c" font-weight="700" text-anchor="start">POR QUÉ</text>
  <text x="40" y="814" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">Este intervalo cae entero en resto, así que la celda sale medida. Cuando llegue el</text>
  <text x="40" y="832" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">siguiente —17:55 a 18:20, 4,0 kWh— sí cruza el borde de punta: sus minutos se</text>
  <text x="40" y="850" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">reparten 5 de un lado y 20 del otro, o sea 0,8 kWh a resto y 3,2 a punta, y las</text>
  <text x="40" y="868" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">dos celdas pasan a interpoladas. Recalcular todo en vez de solo lo que tocó la</text>
  <text x="40" y="886" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">lectura nueva es más caro a propósito: así el resultado no depende del orden de</text>
  <text x="40" y="904" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">llegada.</text>
  <text x="40" y="938" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">pipeline/src/pipeline/transformaciones.py:227 (CeldasVigentes)</text>
</svg>
