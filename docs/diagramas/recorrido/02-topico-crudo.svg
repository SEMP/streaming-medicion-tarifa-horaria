<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 618" width="1120" height="618" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker></defs>
  <rect width="1120" height="618" fill="#ffffff"/>
  <text x="40" y="44" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">02. medicion.lecturas.v1</text>
  <text x="40" y="70" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#744210" font-weight="600" text-anchor="start">El log crudo: lo que llegó, tal como llegó</text>
  <rect x="40" y="110" width="1040" height="66" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6"/>
  <text x="56" y="132" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#718096" font-weight="700" text-anchor="start">LO QUE LLEGA</text>
  <text x="56" y="152" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">La Lectura serializada</text>
  <line x1="560" y1="178" x2="560" y2="196" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="202" width="1040" height="120" rx="7" fill="#fffbeb" stroke="#b7791f" stroke-width="1.6"/>
  <text x="56" y="224" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">QUÉ LE PASA</text>
  <text x="56" y="244" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. clave  = medidor_id, en bytes</text>
  <text x="56" y="262" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. valor  = el JSON entero, en bytes</text>
  <text x="56" y="280" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. Kafka elige partición por hash de la clave</text>
  <text x="56" y="298" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. El productor va con acks=all e idempotencia</text>
  <line x1="560" y1="324" x2="560" y2="342" stroke="#2d3748" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="40" y="348" width="1040" height="120" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="56" y="370" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">LO QUE SALE</text>
  <text x="56" y="390" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">clave : b&#x27;MED-0042&#x27;</text>
  <text x="56" y="408" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">valor : b&#x27;{&quot;schema_version&quot;: 1, &quot;event_id&quot;: ...}&#x27;</text>
  <text x="56" y="426" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start"></text>
  <text x="56" y="444" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4 particiones · retención 7 días · delete</text>
  <text x="40" y="494" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#1a202c" font-weight="700" text-anchor="start">POR QUÉ</text>
  <text x="40" y="520" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">La clave es el medidor y no la cabina. Dos razones: de 1 a 199 medidores por cabina desbalancearía el reparto en un</text>
  <text x="40" y="538" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">factor de 200, y la clave es lo que garantiza que las lecturas de un mismo medidor lleguen en orden — sin ese orden,</text>
  <text x="40" y="556" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">restar dos lecturas consecutivas no tendría sentido.</text>
  <text x="40" y="590" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">docs/contratos.md sección 1 · simulador/src/simulador/publicador.py:18</text>
</svg>
