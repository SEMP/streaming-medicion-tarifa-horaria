    <rect width="1180" height="355" fill="#ffffff"/>
  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">01. Leer lecturas del tópico crudo</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">KafkaIO no es una librería Python: es una transformación cross-language que ejecuta el SDK de Java, en modo PROCESS dentro del</text>
  <text x="40" y="83" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">TaskManager.</text>
