  <text x="430" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">PROCESO</text>
  <text x="830" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">SALIDA</text>
    <rect x="40" y="117" width="350" height="180" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
