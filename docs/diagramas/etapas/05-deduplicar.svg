  <text x="444" y="466" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Sin expiración el conjunto crecería sin límite: la</text>
  <text x="444" y="482" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">entrada de un pipeline de streaming no está</text>
  <text x="444" y="498" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">acotada.</text>
