<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 665" width="1180" height="665" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/>
    </marker>
  </defs>
    <rect width="1180" height="665" fill="#ffffff"/>
  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">07. Celdas vigentes: atribución por franja</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">Es una sola etapa con estado y no dos agregaciones, y ese es el punto: encadenar dos agregaciones bajo modo acumulativo contaba</text>
  <text x="40" y="83" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">doble (decisión 12).</text>
    <text x="40" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2c5282" font-weight="700" text-anchor="start">ENTRADA</text>
  <text x="430" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">PROCESO</text>
  <text x="830" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">SALIDA</text>
    <rect x="40" y="117" width="350" height="86" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="54" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#2c5282" font-weight="600" text-anchor="start">Consumos por intervalo</text>
  <text x="54" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">KV[str, Consumo]</text>
  <text x="54" y="189" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">clave = medidor_id</text>
  <rect x="430" y="117" width="360" height="275" rx="7" fill="#fffbeb" stroke="#b7791f" stroke-width="1.6"/>
  <text x="444" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#744210" font-weight="600" text-anchor="start">ParDo(CeldasVigentes)</text>
  <text x="444" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. ¿el borde izquierdo ya tiene</text>
  <text x="444" y="189" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   un intervalo igual o más corto?</text>
  <text x="444" y="208" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   sí -&gt; este quedó superado, sale</text>
  <text x="444" y="227" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. lo agrega a los vigentes</text>
  <text x="444" y="246" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. recalcula TODAS las celdas</text>
  <text x="444" y="265" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   del medidor desde cero</text>
  <text x="444" y="284" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. reparte por franja; si el cruce</text>
  <text x="444" y="303" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   supera el umbral, indeterminada</text>
  <text x="444" y="322" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">5. emite solo lo que cambió</text>
  <text x="444" y="346" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Recalcular todo es más caro y es a propósito: el</text>
  <text x="444" y="362" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">resultado no depende del orden de llegada, así que</text>
  <text x="444" y="378" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">ningún orden raro deja una celda vieja.</text>
  <rect x="430" y="408" width="360" height="199" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="444" y="434" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#553c9a" font-weight="600" text-anchor="start">Estado por clave y ventana</text>
  <text x="444" y="461" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">INTERVALOS : ReadModifyWrite</text>
  <text x="444" y="480" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">CELDAS     : ReadModifyWrite</text>
  <text x="444" y="499" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">EXPIRA     : Timer(WATERMARK)</text>
  <text x="444" y="518" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">métricas: celdas_emitidas,</text>
  <text x="444" y="537" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">          celdas_indeterminadas</text>
  <text x="444" y="561" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">INTERVALOS es lo que evita el doble conteo: sin él,</text>
  <text x="444" y="577" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">el intervalo grosero seguía sumando junto con las</text>
  <text x="444" y="593" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">dos mitades que lo reemplazan.</text>
  <line x1="610" y1="392" x2="610" y2="408" stroke="#6b46c1" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="830" y="117" width="310" height="218" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="844" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#22543d" font-weight="600" text-anchor="start">Celda, valor absoluto</text>
  <text x="844" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">clave = medidor|fecha|franja</text>
  <text x="844" y="189" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">energia_kwh, interpolada,</text>
  <text x="844" y="208" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">indeterminada, minutos_cubiertos,</text>
  <text x="844" y="227" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">minutos_indeterminados,</text>
  <text x="844" y="246" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">separacion_maxima_minutos,</text>
  <text x="844" y="265" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">cabina_id, intervalos_usados</text>
  <text x="844" y="289" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Valor absoluto, no incremento: por eso el</text>
  <text x="844" y="305" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">consumidor hace upsert y reprocesar es</text>
  <text x="844" y="321" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">inocuo.</text>
  <line x1="790" y1="143" x2="821" y2="143" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="390" y1="143" x2="421" y2="143" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="40" y="643" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">pipeline/src/pipeline/transformaciones.py:227 (CeldasVigentes)</text>
</svg>
