<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 419" width="1180" height="419" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/>
    </marker>
  </defs>
    <rect width="1180" height="419" fill="#ffffff"/>
  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">03. Marcar el tiempo de evento</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">El record de Kafka trae cuándo se publicó; instante_lectura trae cuándo se midió. Entre los dos puede haber horas, y ventanear por</text>
  <text x="40" y="83" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">el de publicación metería el consumo en el día equivocado.</text>
    <text x="40" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2c5282" font-weight="700" text-anchor="start">ENTRADA</text>
  <text x="430" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">PROCESO</text>
  <text x="830" y="107" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">SALIDA</text>
    <rect x="40" y="117" width="350" height="67" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="54" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#2c5282" font-weight="600" text-anchor="start">Lecturas parseadas</text>
  <text x="54" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">tuple[str, dict]</text>
  <rect x="430" y="117" width="360" height="180" rx="7" fill="#fffbeb" stroke="#b7791f" stroke-width="1.6"/>
  <text x="444" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#744210" font-weight="600" text-anchor="start">FlatMap(marcar_tiempo_de_evento)</text>
  <text x="444" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. lee instante_lectura</text>
  <text x="444" y="189" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. datetime.fromisoformat</text>
  <text x="444" y="208" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. exige offset de huso</text>
  <text x="444" y="227" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">4. TimestampedValue</text>
  <text x="444" y="251" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">El instante lo pone el concentrador, no el medidor:</text>
  <text x="444" y="267" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">muchos equipos tienen el reloj mal o no reportan</text>
  <text x="444" y="283" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">hora (decisión 3).</text>
  <rect x="830" y="117" width="310" height="86" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="844" y="143" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#22543d" font-weight="600" text-anchor="start">Con tiempo de evento</text>
  <text x="844" y="170" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">TimestampedValue</text>
  <text x="844" y="189" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">(medidor, payload)</text>
  <line x1="790" y1="143" x2="821" y2="143" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <rect x="830" y="219" width="310" height="142" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
  <text x="844" y="245" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c53030" font-weight="600" text-anchor="start">Cuarentena</text>
  <text x="844" y="272" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">instante_invalido</text>
  <text x="844" y="291" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">instante_sin_huso</text>
  <text x="844" y="315" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Sin offset, la franja atribuida dependería</text>
  <text x="844" y="331" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">de en qué máquina corre el pipeline</text>
  <text x="844" y="347" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">(decisión 4).</text>
  <line x1="790" y1="245" x2="821" y2="245" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="390" y1="143" x2="421" y2="143" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="40" y="397" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">pipeline/src/pipeline/cadena.py:115 (marcar_tiempo_de_evento)</text>
</svg>
