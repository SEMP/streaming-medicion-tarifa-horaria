<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 402" width="1180" height="402" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/>
    </marker>
  </defs>
    <rect width="1180" height="402" fill="#ffffff"/>
  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">02. Parsear: de bytes a diccionario</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">Primera etapa que puede rechazar. Un mensaje ilegible va igual a cuarentena, con sus bytes crudos: nada se descarta en silencio.</text>
    <text x="40" y="90" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2c5282" font-weight="700" text-anchor="start">ENTRADA</text>
  <text x="430" y="90" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#744210" font-weight="700" text-anchor="start">PROCESO</text>
  <text x="830" y="90" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#22543d" font-weight="700" text-anchor="start">SALIDA</text>
    <rect x="40" y="100" width="350" height="67" rx="7" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="54" y="126" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#2c5282" font-weight="600" text-anchor="start">Records de Kafka</text>
  <text x="54" y="153" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">tuple[bytes, bytes]</text>
  <rect x="430" y="100" width="360" height="180" rx="7" fill="#fffbeb" stroke="#b7791f" stroke-width="1.6"/>
  <text x="444" y="126" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#744210" font-weight="600" text-anchor="start">FlatMap(parsear)</text>
  <text x="444" y="153" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">1. json.loads del valor</text>
  <text x="444" y="172" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">2. medidor_id del cuerpo,</text>
  <text x="444" y="191" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">   o de la clave si falta</text>
  <text x="444" y="210" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">3. emite (medidor, payload)</text>
  <text x="444" y="234" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Se lee el medidor del cuerpo y no de la clave</text>
  <text x="444" y="250" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">porque la clave puede venir vacía; la clave sirve</text>
  <text x="444" y="266" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">de respaldo.</text>
  <rect x="830" y="100" width="310" height="86" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="844" y="126" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#22543d" font-weight="600" text-anchor="start">Salida principal</text>
  <text x="844" y="153" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">tuple[str, dict]</text>
  <text x="844" y="172" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">clave = medidor_id</text>
  <line x1="790" y1="126" x2="821" y2="126" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <rect x="830" y="202" width="310" height="142" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
  <text x="844" y="228" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c53030" font-weight="600" text-anchor="start">Cuarentena</text>
  <text x="844" y="255" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">json_invalido</text>
  <text x="844" y="274" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="12.5" fill="#1a202c" font-weight="normal" text-anchor="start">sin_medidor_id</text>
  <text x="844" y="298" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">json_invalido lleva los primeros 200 bytes</text>
  <text x="844" y="314" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">crudos, porque no se le puede leer ni el</text>
  <text x="844" y="330" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">medidor.</text>
  <line x1="790" y1="228" x2="821" y2="228" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="390" y1="126" x2="421" y2="126" stroke="#2d3748" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="40" y="380" font-family="'DejaVu Sans Mono','Menlo',monospace" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">pipeline/src/pipeline/cadena.py:89 (parsear)</text>
</svg>
