  <text x="444" y="270" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">Sin trigger y no es un olvido: los triggers</text>
  <text x="444" y="286" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">disparan en un GroupByKey o un Combine, y no hay</text>
  <text x="444" y="302" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#718096" font-weight="normal" text-anchor="start">ninguno. Configurarlo sugeriría algo que no ocurre.</text>
