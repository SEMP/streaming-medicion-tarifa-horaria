  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">04. Ventana diaria y tipado de la clave</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">La ventana no agrupa: acá no hay GroupByKey. Aporta el window.end contra el que se programan los temporizadores, y la lateness que</text>
  <text x="40" y="83" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">fija cuándo expira el estado.</text>
