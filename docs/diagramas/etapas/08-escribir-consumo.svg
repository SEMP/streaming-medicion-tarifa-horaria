  <text x="40" y="42" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#1a202c" font-weight="600" text-anchor="start">08. Escribir al tópico derivado</text>
  <text x="40" y="66" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4a5568" font-weight="normal" text-anchor="start">La clave del mensaje es la celda, de modo que recalcular reemplace en lugar de duplicar. Es lo que hace idempotente a la salida.</text>
