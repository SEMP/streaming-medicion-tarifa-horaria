# Calendario tarifario e intervalo de medición.
#
# Copiar a config/franjas.toml y ajustar. Ese archivo NO se versiona, para que cada
# integrante pueda probar con calendarios distintos sin pisarse.

# Zona horaria en la que están definidas las franjas. Identificador IANA, no un offset
# fijo: el identificador sobrevive a un cambio de política horaria, el offset no.
zona_horaria = "America/Asuncion"

# Cada cuánto se intenta consultar un medidor, en minutos. Es una ASPIRACIÓN, no una
# garantía: los medidores de una cabina comparten un bus RS-485 y se leen en secuencia, así
# que la separación real entre dos lecturas del mismo equipo la fija la duración de la ronda
# —de 6 a 60 minutos según el tamaño de la cabina y su tasa de fallas—, no este número.
cadencia_objetivo_minutos = 15

# Separación máxima entre las dos lecturas que rodean un borde de franja para que todavía se
# acepte interpolar. Por encima de esto el consumo se marca `indeterminado` en lugar de
# inventarse.
#
# ⚠️ PENDIENTE P1: el valor de abajo es un marcador de posición, no una decisión tomada.
# Tiene consecuencia económica en los dos sentidos: tolerar de más mete consumo de una franja
# en otra, y tolerar de menos deja franjas sin cerrar y sin facturar.
separacion_maxima_minutos = 45

# Una franja puede tener varios rangos: "resto" cubre la mañana y la noche tardía.
[[franjas]]
nombre = "valle"
rangos = [{ desde = "00:00", hasta = "07:00" }]

[[franjas]]
nombre = "resto"
rangos = [
  { desde = "07:00", hasta = "18:00" },
  { desde = "22:00", hasta = "24:00" },
]

[[franjas]]
nombre = "punta"
rangos = [{ desde = "18:00", hasta = "22:00" }]

# ---------------------------------------------------------------------------
# Reglas que la validación debe hacer cumplir
# ---------------------------------------------------------------------------
#
# 1. COBERTURA EXACTA DEL DÍA
#    Los rangos deben cubrir de 00:00 a 24:00 sin huecos y sin superposiciones. Un hueco
#    dejaría energía sin franja; una superposición la facturaría dos veces. Un calendario
#    que no cierre se RECHAZA, con un mensaje que diga qué tramo falta o se pisa.
#
# 2. NOMBRES DE FRANJA ÚNICOS
#    Cada nombre aparece una sola vez, con todos sus rangos juntos. Es lo que permite que la
#    clave de salida `medidor|fecha|franja` identifique una celda sin ambigüedad.
#
# 3. RANGOS BIEN FORMADOS
#    `desde` < `hasta`, en HH:MM, y `hasta = "24:00"` es válido como fin del día.
#
# ---------------------------------------------------------------------------
# Lo que ESTA configuración ya NO exige, y por qué
# ---------------------------------------------------------------------------
#
# Hasta el 20/09 había una regla de ALINEACIÓN A LA GRILLA: los bordes de franja debían ser
# múltiplos del intervalo de medición, de modo que ninguna medición cruzara un borde y la
# atribución fuera exacta por construcción.
#
# Esa regla suponía una grilla fija de medición, que es como funciona un medidor con perfil
# de carga. Este parque solo expone modo readout: no hay grilla, hay rondas continuas sobre
# un bus compartido, y la posición de cada lectura depende de cuántos medidores tiene la
# cabina y de cuántos fallaron antes.
#
# O sea que los intervalos SÍ cruzan bordes, siempre, y no hay configuración que lo evite.
# Por eso la interpolación dejó de ser una optimización y pasó a ser obligatoria, y por eso
# cada resultado declara su propio error de atribución.
#
# Ver decisión 5 en docs/decisiones-de-diseno.md.
